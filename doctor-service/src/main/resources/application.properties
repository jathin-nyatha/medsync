# Application
spring.application.name=doctor-service

# Server
server.port=8082

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/medsync_doctor
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Auth Service integration
medsync.services.auth.base-url=http://localhost:8081

# JWT validation
jwt.issuer=medsync-auth-service
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always