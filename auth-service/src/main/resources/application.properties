spring.application.name=auth-service

# ========================================
# Server
# ========================================
server.port=8081

# ========================================
# MySQL Database
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/medsync_auth
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================================
# JWT
# ========================================
jwt.issuer=medsync-auth-service
jwt.expiration=3600000

# ========================================
# RSA keystore configuration
# ========================================
jwt.keystore.path=${JWT_KEYSTORE_PATH:D:/Projects/MedSync/jwt-keys/medsync-jwt.p12}
jwt.keystore.password=${JWT_KEYSTORE_PASSWORD:changeit}
jwt.keystore.alias=medsync-jwt

# ========================================
# Initial ADMIN bootstrap
# ========================================
medsync.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
medsync.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
medsync.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Service JWT lifetime: 5 minutes
jwt.service-token-expiration-seconds=${JWT_SERVICE_TOKEN_EXPIRATION_SECONDS:300}

# ==========================================
# Service-to-Service Authentication
# ==========================================

medsync.security.appointment-service.client-id=${APPOINTMENT_SERVICE_CLIENT_ID:appointment-service}

medsync.security.appointment-service.client-secret=${APPOINTMENT_SERVICE_CLIENT_SECRET:}


# ========================================
# Actuator
# ========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always