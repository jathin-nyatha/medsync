spring.application.name=auth-service

# ========================================
# Server
# ========================================
server.port=8081

# ========================================
# MySQL Database
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/medsync_auth
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================================
# JWT
# ========================================
jwt.issuer=medsync-auth-service
jwt.expiration=3600000
jwt.secret=${JWT_SECRET}

# ========================================
# Initial ADMIN bootstrap
# ========================================
medsync.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
medsync.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
medsync.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# ========================================
# Actuator
# ========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always