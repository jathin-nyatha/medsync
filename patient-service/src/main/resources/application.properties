# Application
spring.application.name=patient-service

# Server
server.port=8083

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medsync_patient}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT validation
jwt.issuer=medsync-auth-service
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}

# Spring AI - Ollama
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:llama3.2:3b}

# Model generation settings
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.num-ctx=4096
spring.ai.ollama.init.pull-model-strategy=never

# Appointment Service
services.appointment.base-url=${APPOINTMENT_SERVICE_URL:http://localhost:8084}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never