
# =========================================================
# Application Configuration
# =========================================================

spring.application.name=notification-service

server.port=8085


# =========================================================
# Database Configuration
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medsync_notification}

spring.datasource.username=${DB_USERNAME}

spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration


# =========================================================
# JWT / Spring Security Configuration
# =========================================================

jwt.issuer=medsync-auth-service

jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}


# =========================================================
# Amazon SES Configuration
# =========================================================

medsync.notification.ses.region=${AWS_REGION:ap-southeast-2}
medsync.notification.ses.from-email=${SES_FROM_EMAIL:srijanyatha@gmail.com}
medsync.notification.ses.enabled=${SES_ENABLED:false}

# Notification delivery worker
medsync.notification.delivery.poll-interval-ms=${NOTIFICATION_POLL_INTERVAL_MS:5000}
medsync.notification.delivery.batch-size=${NOTIFICATION_BATCH_SIZE:25}
medsync.notification.delivery.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:5}
medsync.notification.delivery.base-delay-seconds=${NOTIFICATION_RETRY_BASE_DELAY_SECONDS:30}
medsync.notification.delivery.max-delay-seconds=${NOTIFICATION_RETRY_MAX_DELAY_SECONDS:21600}

# Notification delivery processing lease: 5 minutes
medsync.notification.delivery.lease-duration-seconds=${NOTIFICATION_LEASE_DURATION_SECONDS:300}
medsync.notification.delivery.enabled=${NOTIFICATION_DELIVERY_ENABLED:false}

# =========================================================
# Actuator Configuration
# =========================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=never
