
# ==========================================
# Application Configuration
# ==========================================

spring.application.name=appointment-service
server.port=8084


# ==========================================
# MySQL Database Configuration
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medsync_appointment}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# ==========================================
# JPA / Hibernate Configuration
# ==========================================

# Development configuration.
# We will use Flyway migrations before production deployment.
spring.jpa.hibernate.ddl-auto=update

# Avoid exposing SQL statements in application logs.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Avoid lazy-loading database queries from the web layer.
spring.jpa.open-in-view=false

# Store and interpret JDBC timestamps consistently.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ==========================================
# JWT Configuration
# ==========================================

jwt.issuer=medsync-auth-service

jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:D:/Projects/MedSync/jwt-keys/jwt-public.crt}


# ==========================================
# Actuator Configuration
# ==========================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never


# ==========================================
# MedSync Downstream Service Configuration
# ==========================================

medsync.clients.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8081}

medsync.clients.doctor-service-url=${DOCTOR_SERVICE_URL:http://localhost:8082}

medsync.clients.patient-service-url=${PATIENT_SERVICE_URL:http://localhost:8083}

# HTTP connection and response timeouts
medsync.clients.connect-timeout=3s
medsync.clients.read-timeout=5s


# ==========================================
# Service-to-Service Authentication
# ==========================================

medsync.security.appointment-service.client-id=${APPOINTMENT_SERVICE_CLIENT_ID:appointment-service}

medsync.security.appointment-service.client-secret=${APPOINTMENT_SERVICE_CLIENT_SECRET:}
