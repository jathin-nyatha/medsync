
# ==========================================
# Application Configuration
# ==========================================

spring.application.name=appointment-service
server.port=8084


# ==========================================
# MySQL Database Configuration
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medsync_appointment}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# ==========================================
# JPA / Hibernate Configuration
# ==========================================

# Development configuration.
# We will use Flyway migrations before production deployment.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Avoid exposing SQL statements in application logs.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Avoid lazy-loading database queries from the web layer.
spring.jpa.open-in-view=false

# Store and interpret JDBC timestamps consistently.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ==========================================
# JWT Configuration
# ==========================================

jwt.issuer=medsync-auth-service

jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}


# ==========================================
# Actuator Configuration
# ==========================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never


# ==========================================
# MedSync Downstream Service Configuration
# ==========================================

medsync.clients.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8081}

medsync.clients.doctor-service-url=${DOCTOR_SERVICE_URL:http://localhost:8082}

medsync.clients.patient-service-url=${PATIENT_SERVICE_URL:http://localhost:8083}

# HTTP connection and response timeouts
medsync.clients.connect-timeout=${MEDSYNC_CLIENTS_CONNECT_TIMEOUT:3s}
medsync.clients.read-timeout=${MEDSYNC_CLIENTS_READ_TIMEOUT:5s}


# Outbox notification dispatcher
medsync.outbox.dispatcher.enabled=${OUTBOX_DISPATCHER_ENABLED:false}
medsync.outbox.dispatcher.fixed-delay=${OUTBOX_DISPATCHER_FIXED_DELAY:5s}
medsync.outbox.dispatcher.batch-size=${OUTBOX_DISPATCHER_BATCH_SIZE:10}
medsync.outbox.dispatcher.lease-duration=${OUTBOX_DISPATCHER_LEASE_DURATION:120s}
medsync.outbox.dispatcher.max-attempts=${OUTBOX_DISPATCHER_MAX_ATTEMPTS:5}
medsync.outbox.dispatcher.initial-retry-delay=${OUTBOX_DISPATCHER_INITIAL_RETRY_DELAY:5s}
medsync.outbox.dispatcher.max-retry-delay=${OUTBOX_DISPATCHER_MAX_RETRY_DELAY:300s}

# ==========================================
# Service-to-Service Authentication
# ==========================================

medsync.security.appointment-service.client-id=${APPOINTMENT_SERVICE_CLIENT_ID:appointment-service}

medsync.security.appointment-service.client-secret=${APPOINTMENT_SERVICE_CLIENT_SECRET:}

medsync.clients.notification-service-url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}