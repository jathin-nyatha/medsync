# Dedicated database for Appointment Service automated tests
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/medsync_appointment_test}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT configuration
jwt.issuer=medsync-auth-service
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:D:/Projects/MedSync/jwt-keys/jwt-public.crt}

# Downstream service configuration
medsync.clients.doctor-service-url=${DOCTOR_SERVICE_URL:http://localhost:8082}
medsync.clients.patient-service-url=${PATIENT_SERVICE_URL:http://localhost:8083}
medsync.clients.connect-timeout=3s
medsync.clients.read-timeout=5s

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never